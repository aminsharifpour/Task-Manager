server {
  listen 80;
  server_name _;
  client_max_body_size 28m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  # Optional existing Nginx gateway: API must use SERVE_CLIENT=true.
  # HTML, robots and sitemap come from API so metadata and private noindex remain correct.
  location / {
    proxy_pass http://api:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /socket.io/ {
    proxy_pass http://api:8787/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
  }
}
